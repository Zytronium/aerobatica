[package]
name = "mod-aerobatica"
version = "1.0.3"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by the launcher.
# Required for the launcher build; for standalone `cargo test`, the launcher
# moves this file aside or you can skip the dependency by not using mod-api features.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }

[package.metadata.horizon]
sdk = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
