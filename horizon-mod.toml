id = "aerobatica"
name = "Aerobatica"
version = "1.0.3"
description = "Fly an elytra like an aircraft: mouse X rolls, mouse Y pitches, A/D keys steer (rudder). Smooth camera, invert Y option, and realistic flight physics."
authors = ["Horizon"]
license = "MIT"
api = "0.2"
side = "client"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "f037744a79f9982c47876f49c5a3067279f88706"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[[native.module]]
id = "aerobatica"
file = "crates/horizon-client/src/client_lib.rs"
name = "aerobatica"
source = "src/aerobatica.rs"
visibility = "pub"

[[native.mixin]]
id = "frame-handler"
target = "horizon_client::game::native_hooks::render_frame_pre::Game::native_render_frame_pre"
kind = "HEAD"
helper = "src/mixins/frame_helper.rs"
bindings = [
    { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
    { name = "elapsed", ty = "std::time::Duration", value = "elapsed" },
]

[[native.mixin]]
id = "spin-roll"
target = "horizon_client::game::fov::Game<'_>::spinning_matrix"
kind = "RETURN"
helper = "src/mixins/spin_helper.rs"
bindings = [
    { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
    { name = "value", ty = "glam::Mat4", value = "$value" },
]

[[native.mixin]]
id = "turn-handler"
target = "horizon_client::game::pointer_capture::Game<'_>::apply_mouse_look"
kind = "OVERWRITE"
helper = "src/mixins/turn_helper.rs"
bindings = [
    { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[native.mixin]]
id = "avatar-start"
target = "horizon_client::game::perspective::Game<'_>::player_model_geometry"
kind = "HEAD"
helper = "src/mixins/avatar_start_helper.rs"
bindings = [
    { name = "out", ty = "&Vec<horizon_client_render::render_geometry::Vertex>", value = "&*out" },
]

[[native.mixin]]
id = "avatar-roll"
target = "horizon_client::game::perspective::Game<'_>::player_model_geometry"
kind = "AFTER_CALL"
selector = "self.mod_render_post"
ordinal = 0
require = 1
result = "()"
helper = "src/mixins/avatar_helper.rs"
bindings = [
    { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
    { name = "out", ty = "&mut Vec<horizon_client_render::render_geometry::Vertex>", value = "&mut *out" },
    { name = "camera", ty = "glam::DVec3", value = "camera" },
    { name = "alpha", ty = "f64", value = "alpha" },
]
